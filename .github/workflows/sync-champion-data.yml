name: Sync champion data

on:
  schedule:
    - cron: '0 4 * * 1,4'   # lunes y jueves, 4am UTC
  workflow_dispatch: {}       # te permite correrlo a mano desde la pestaña Actions

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar tipos de Astro
        run: npx astro sync

      - name: Validar parser y scoring LoLalytics
        run: |
          npx tsc --noEmit
          npx tsx tests/buildQuality.test.ts
          node --experimental-sqlite node_modules/tsx/dist/cli.mjs tests/lolalytics.integration.test.ts

      - name: Sincronizar estructura de carriles (OP.GG)
        run: npm run sync:lanes:cli

      - name: Sincronizar Meta, builds y datos LoLalytics
        run: npm run sync:cli

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publicar base de datos a HexDraft-Releases
        run: python publish_db.py
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
